<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>RivalCFG UI</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="6" y="2.5" width="12" height="19" rx="6"/>
        <path d="M12 2.5v6"/>
        <path d="M9 8.5h6"/>
      </svg>
      <div class="brand-text">
        <div class="brand-name">RivalCFG UI</div>
        <div class="brand-sub">SteelSeries Control</div>
      </div>
      <div class="brand-actions">
        <button class="theme-toggle" id="settings-toggle" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <div class="settings-pop" id="settings-pop">
      <div class="side-label" id="lang-label">Language</div>
      <select class="select" id="lang-select">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <section class="side-card side-card-click" id="device-status" role="button" tabindex="0" title="Перейти к выбору устройства">
      <div class="status-dot" id="status-dot"></div>
      <div class="status-text">
        <div class="status-title" id="status-name">Searching…</div>
        <div class="status-sub" id="status-id">&nbsp;</div>
      </div>
    </section>

    <nav class="side-nav" id="side-nav" aria-label="Разделы настроек"></nav>

    <section class="side-section side-section-bottom">
      <div class="side-label" id="profiles-label">Profiles</div>
      <select class="select" id="profile-select"><option value="">—</option></select>
      <div class="side-actions">
        <button class="btn" id="profile-save" type="button">Save</button>
        <button class="btn btn-danger" id="profile-delete" type="button">Delete</button>
      </div>
    </section>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title" id="page-title">Devices</h1>
        <div class="page-sub" id="page-sub">&nbsp;</div>
      </div>
      <div class="topbar-actions">
        <a class="btn" id="btn-docs" href="#" hidden target="_blank" rel="noreferrer">Docs</a>
        <label class="auto-apply" title="Apply every change immediately">
          <input type="checkbox" id="auto-apply" checked />
          <span>Auto-apply</span>
        </label>
        <button class="btn" id="btn-revert" type="button" disabled>Revert</button>
        <button class="btn btn-primary" id="btn-apply" type="button" disabled>Apply</button>
      </div>
    </header>

    <div class="toast" id="toast" hidden></div>
    <div class="settings" id="settings"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
